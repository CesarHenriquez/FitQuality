<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar - FitQuality</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header__content">
      <a class="logo" href="index.html">
        <img src="assets/img/fitquality.png" alt="FitQuality" />
      </a>
      <nav class="nav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
        <a class="btn btn--sm" href="login.html" aria-current="page">Ingresar</a>
        <a href="cart.html">Carrito <span id="cart-count" class="badge">0</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="grid page-wrap bg-cover"
      style="--bg-url: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhEhePUKdqcKGn5WFGhodLS266QttCEZoI6mDINQdh6nbi07YiI9BRI4r6HoTfVPnA1lO_j-F1iarjVCSQxXLZsqhozeIsmjcGizieliDnHZ-VSJYEUVDlgBeaaw-36gvIiny5R4W8jX6xvkJrRaAlWtUzdtFcuSMmc8m9L6jfg1kXRb-9QXNNohPSuoZA/s1600/0.webp');">
      <div class="container page-narrow">
        <h1 class="page-title">Ingresar</h1>
        <p class="muted" style="text-align:center;margin-bottom:16px">
          Accede para guardar tu progreso y continuar tu compra.
        </p>

        <form id="form-login" class="form" novalidate>
          <div class="form-group">
            <label for="login-correo">Correo electrónico</label>
            <input type="email" id="login-correo" name="correo"
              maxlength="100" required placeholder="ejemplo@gmail.com"
              pattern="^[a-zA-Z0-9._%+-]+@gmail\\.com$" />
            <small class="form-text">Solo se permite el dominio <strong>@gmail.com</strong></small>
          </div>

          <div class="form-group">
            <label for="login-pass">Contraseña</label>
            <input type="password" id="login-pass" name="password"
              minlength="4" maxlength="10" required placeholder="4 a 10 caracteres" />
          </div>

          <button type="submit" class="btn" style="width:100%">Ingresar</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__content">
      <small>© 2025 FitQuality — Todos los derechos reservados</small>
      <div class="footer__links">
        <a href="registro.html">Crear cuenta</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/validaciones.js"></script>
</body>
</html>
